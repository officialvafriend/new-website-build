<title>액상덕후 스토어</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:Pretendard;font-display:swap;src:local("Pretendard Variable"),local("Pretendard")}
:root{
 --font:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --bg:#FFFFFF;--bg2:#F5F5F7;--line:#E6E8EA;--line2:#D2D6DA;
 --ink:#111111;--ink2:#4E565F;--ink3:#616870;
 --ac:#38BDF8;--acink:#111111;--acsoft:#E8F5FE;--acdeep:#1565C0;
 --pend:#8A5A12;--chk:#B42318;--paid:#1F5F46;--ship:#5B21B6;--done:#616870;
 --ez:cubic-bezier(.2,0,.2,1);--gut:clamp(1rem,.5rem + 2vw,2.5rem);--tab:60px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
 word-break:keep-all;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
@media(min-width:880px){body{padding-bottom:0}}
h1,h2,h3{margin:0;line-height:1.24;letter-spacing:-.03em;font-weight:900}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--acdeep);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
.n{font-variant-numeric:tabular-nums}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* 헤더 */
.gnb{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.gnb-in{display:flex;align-items:center;gap:.8rem;height:52px}
.lg{display:flex;align-items:center;gap:.35rem;font-weight:900;font-size:16px;letter-spacing:-.05em}
.lg .g{width:18px;height:18px;border-radius:50% 50% 50% 4px;background:var(--ink)}
.gnb nav{display:none;gap:1rem;margin-left:.5rem}
@media(min-width:880px){.gnb nav{display:flex}}
.gnb nav a{font-size:12.5px;color:var(--ink2);font-weight:500}
.gnb nav a:hover,.gnb nav a.on{color:var(--ink)}
.gnb .sp{margin-left:auto;display:flex;gap:.1rem;align-items:center}
.gi{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.gi:hover{background:var(--bg2)}
.gi .b{position:absolute;top:4px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--ac);
 color:var(--acink);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.gi .who{font-size:11.5px;font-weight:700;padding:0 .5rem;width:auto;min-width:44px}

/* 하단 탭 (모바일) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:#fff;border-top:1px solid var(--line2);
 padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:880px){.tabs{display:none}}
.tabs a{flex:1 1 0;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
 font-size:10px;color:var(--ink3);font-weight:600}
.tabs a i{font-style:normal;font-size:17px;line-height:1}
.tabs a.on{color:var(--acdeep)}

/* 공통 */
.sec{padding:clamp(1.5rem,3vw,2.5rem) 0 0}
.sec-h{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:.9rem}
.sec-h h2{font-size:clamp(1.2rem,1.05rem + .8vw,1.6rem)}
.sec-h .sub{font-size:12.5px;color:var(--ink3);font-weight:500}
.lk{font-size:13.5px;color:var(--acdeep);font-weight:600}
.lk:hover{text-decoration:underline}
.btn{min-height:48px;border-radius:999px;padding:0 1.3rem;font-size:15px;font-weight:800;display:inline-flex;
 align-items:center;justify-content:center;gap:.4rem;transition:filter 160ms var(--ez),transform 160ms var(--ez)}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--ac);color:var(--acink)}
.btn-p:hover{filter:brightness(1.06)}
.btn-d{background:var(--ink);color:#fff}
.btn-o{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn-o:hover{border-color:var(--ink)}
.btn-w{width:100%}
.btn-dg{background:#fff;color:var(--chk);border:1px solid #E9B4AF}
.btn-sm{min-height:40px;font-size:13px;padding:0 .9rem}
.crumb{font-size:12px;color:var(--ink3);padding-top:1rem}
.crumb a{color:var(--ink3)}
.pagetitle{font-size:clamp(1.5rem,1.2rem + 1.4vw,2.2rem);margin:.5rem 0 1.2rem}

/* 카드 */
.grid{display:grid;gap:.7rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--bg2);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;
 transition:transform 200ms var(--ez);text-align:left}
.card:hover{transform:translateY(-4px)}
.card .fig{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center}
.pill{position:absolute;top:.6rem;left:.6rem;font-family:var(--mono);font-size:10.5px;padding:.22rem .45rem;border-radius:6px;
 background:rgba(255,255,255,.92);color:var(--ink)}
.pill.hot{background:var(--ac);color:var(--acink);font-family:var(--font);font-weight:800}
.btl{width:60px;height:100px;border-radius:10px 10px 14px 14px;position:relative;box-shadow:0 10px 22px -12px rgba(0,0,0,.45)}
.btl::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:21px;height:15px;
 border-radius:4px 4px 0 0;background:inherit;filter:brightness(.78)}
.btl::after{content:"";position:absolute;left:9px;right:9px;bottom:15px;height:28px;border-radius:5px;background:rgba(255,255,255,.6)}
.card .bd{padding:.7rem .75rem .9rem;display:flex;flex-direction:column;gap:.12rem;flex:1 1 auto}
.brand{font-size:11px;color:var(--ink3);font-weight:700}
.nm{font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;padding-top:.6rem;display:flex;align-items:flex-end;gap:.5rem}
.pr{flex:1 1 auto;min-width:0}
.pr b{font-size:15.5px;font-weight:900;letter-spacing:-.02em}
.pr .was{text-decoration:line-through;color:var(--ink3);font-weight:500;font-size:11.5px;margin-right:.25rem}
.pr small{display:block;font-size:10.5px;color:var(--ink3);margin-top:.05rem}
.add{flex:0 0 auto;width:36px;height:36px;border-radius:999px;background:var(--ac);color:var(--acink);display:flex;
 align-items:center;justify-content:center;font-size:17px;transition:transform 160ms var(--ez)}
.add:hover{transform:scale(1.08)}
.scroller{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.25rem 0 1rem}
.scroller::-webkit-scrollbar{display:none}
.scroller .card{flex:0 0 auto;width:min(68vw,215px);scroll-snap-align:start}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{min-height:44px;padding:0 .95rem;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:13.5px;
 font-weight:700;display:inline-flex;align-items:center;gap:.35rem}
.chip .c{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.chip.on .c{color:rgba(17,17,17,.6)}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.9rem}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}

/* 폼 */
.field{margin-bottom:.9rem}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:.35rem}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:11px;
 padding:.7rem .85rem;background:#fff;transition:border-color 160ms var(--ez),box-shadow 160ms var(--ez)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acdeep);box-shadow:0 0 0 3px var(--acsoft);outline:none}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:.3rem;line-height:1.5}
.field.key{background:var(--acsoft);border:1.5px solid var(--ac);border-radius:14px;padding:.9rem}
.field.key label{color:var(--ink)}
.field.key .hint{color:#0E4F86}
.err{font-size:12px;color:var(--chk);margin-top:.3rem;font-weight:600}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1rem}
.panel + .panel{margin-top:.7rem}
.panel h3{font-size:15px;margin-bottom:.7rem}
.note{background:var(--acsoft);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:.75rem .85rem;
 font-size:12.5px;line-height:1.65;color:#0E4F86}
.note b{color:#0B3D66}
.warnbox{background:#FEF3F2;border:1px solid #F3C7C2;border-radius:14px;padding:1rem;font-size:13px;color:#7A2019;line-height:1.65}
.warnbox b{color:#5E1512}

/* 상태 배지 */
.st{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;font-weight:800;padding:.24rem .6rem;border-radius:999px;
 border:1px solid currentColor}
.st.pend{color:var(--pend)}.st.chk{color:var(--chk)}.st.paid{color:var(--paid)}
.st.ship{color:var(--ship)}.st.done{color:var(--done)}

/* 목록 행 */
.lrow{display:flex;gap:.8rem;padding:.85rem 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.lthumb{flex:0 0 62px;width:62px;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.lthumb .btl{width:26px;height:44px}
.lthumb .btl::before{width:10px;height:7px;top:-6px}
.lthumb .btl::after{left:4px;right:4px;bottom:7px;height:12px}
.lbody{flex:1 1 auto;min-width:0}
.lbody .t{font-size:13.5px;font-weight:700;line-height:1.4}
.lbody .s{font-size:11.5px;color:var(--ink3);margin-top:.15rem}
.lend{flex:0 0 auto;text-align:right}
.lend b{font-size:14px;font-weight:900}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-top:.35rem}
.qty button{width:34px;height:34px;font-size:15px;font-weight:700}
.qty button:hover{background:var(--bg2)}
.qty span{min-width:32px;text-align:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* 합계 */
.totals{margin-top:1rem;background:var(--bg2);border-radius:16px;padding:1rem}
.totals div{display:flex;justify-content:space-between;font-size:13.5px;padding:.28rem 0;color:var(--ink2)}
.totals div.big{border-top:1px solid var(--line2);margin-top:.5rem;padding-top:.7rem;color:var(--ink)}
.totals div.big b{font-size:20px;font-weight:900;letter-spacing:-.03em}

/* 상품 상세 */
.pd{display:grid;gap:1.2rem;grid-template-columns:1fr}
@media(min-width:900px){.pd{grid-template-columns:1.05fr .95fr;gap:2rem;align-items:start}}
.pd-fig{aspect-ratio:1/1;border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative}
.pd-fig .btl{width:34%;height:56%}
.pd-fig .btl::before{width:36%;height:13%;top:-11%}
.pd-fig .btl::after{left:16%;right:16%;bottom:20%;height:26%}
.pd-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.5rem}
.pd-thumbs button{aspect-ratio:1/1;border-radius:12px;border:2px solid transparent}
.pd-thumbs button.on{border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.75rem .85rem;border:1.5px solid var(--line);border-radius:13px;
 text-align:left;min-height:54px;width:100%}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--ac);background:var(--acsoft)}
.opt .l{flex:1 1 auto;min-width:0}
.opt .l b{display:block;font-size:13.5px;font-weight:800}
.opt .l span{display:block;font-size:11px;color:var(--ink3);margin-top:.1rem}
.opt .d{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.opt.on .d{color:var(--acdeep);font-weight:700}
.buybar{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);
 padding:.8rem 0;display:flex;gap:.5rem;margin-top:1rem;z-index:20}
@media(min-width:880px){.buybar{bottom:0;position:static;border:0;padding-top:1rem}}
.buybar .btn{flex:1 1 0}
.buybar .btn.main{flex:1.5 1 0}

/* 스텝 */
.steps{display:flex;gap:.4rem;margin-bottom:1.2rem}
.steps div{flex:1 1 0;font-size:11.5px;font-weight:700;color:var(--ink3);text-align:center;padding-top:.5rem;
 border-top:3px solid var(--line)}
.steps div.on{color:var(--acdeep);border-top-color:var(--ac)}
.acct{background:var(--bg2);border-radius:14px;padding:.9rem;display:flex;align-items:center;gap:.7rem;margin-top:.6rem}
.acct .v{flex:1 1 auto;min-width:0}
.acct .v b{display:block;font-family:var(--mono);font-size:15px}
.acct .v span{font-size:11.5px;color:var(--ink3)}
.big-ok{text-align:center;padding:2.5rem 0 1rem}
.big-ok .ico{width:64px;height:64px;border-radius:999px;background:var(--ac);color:var(--acink);display:flex;
 align-items:center;justify-content:center;font-size:30px;margin:0 auto 1rem;font-weight:900}
.mine{display:grid;gap:.6rem;grid-template-columns:repeat(2,1fr);margin-top:1rem}
@media(min-width:720px){.mine{grid-template-columns:repeat(4,1fr)}}
.mine a{background:var(--bg2);border-radius:16px;padding:1rem;text-align:center;font-size:13px;font-weight:700}
.mine a i{display:block;font-style:normal;font-size:20px;margin-bottom:.35rem}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 1rem + env(safe-area-inset-bottom));transform:translate(-50%,140%);
 z-index:60;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:.75rem 1.1rem;border-radius:999px;
 transition:transform 300ms var(--ez);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity 240ms var(--ez);z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;z-index:50;
 background:#fff;border-radius:20px;padding:1.3rem;width:min(92vw,400px);transition:all 240ms var(--ez)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:17px;margin-bottom:.6rem}
.modal p{font-size:13.5px;color:var(--ink2);line-height:1.7}
.modal .acts{display:flex;gap:.5rem;margin-top:1.2rem}
.modal .acts .btn{flex:1 1 0}
.empty{text-align:center;padding:3rem 1rem;color:var(--ink3)}
.empty .ico{font-size:34px;margin-bottom:.7rem}
.empty p{font-size:13.5px;margin-bottom:1.2rem}

.cf{--cf-card:clamp(160px,44vw,280px)}
.cf-frame{cursor:grab;overflow:hidden;padding:2.5rem 0 1.5rem;outline:none;touch-action:pan-y}
.cf-frame:active{cursor:grabbing}
.cf-frame:focus-visible{outline:2px solid var(--acdeep);outline-offset:-4px;border-radius:16px}
.cf-track{position:relative;height:var(--cf-card);transform-style:preserve-3d;user-select:none}
.cf-card{position:absolute;left:50%;top:0;width:var(--cf-card);aspect-ratio:1/1;border-radius:20px;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(17,17,17,.45);will-change:transform}
.cf-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.cf-btl{width:34%;height:56%;border-radius:12px 12px 16px 16px;position:relative;box-shadow:0 12px 26px -14px rgba(0,0,0,.5)}
.cf-btl::before{content:"";position:absolute;left:50%;top:-11%;transform:translateX(-50%);width:36%;height:13%;
  border-radius:5px 5px 0 0;background:inherit;filter:brightness(.78)}
.cf-btl::after{content:"";position:absolute;left:16%;right:16%;bottom:20%;height:26%;border-radius:6px;background:rgba(255,255,255,.6)}
.cf-flag{position:absolute;top:.7rem;left:.7rem;font-size:11px;font-weight:800;background:rgba(255,255,255,.94);
  padding:.25rem .55rem;border-radius:999px}
.cf-cap{text-align:center;padding:0 1rem}
.cf-cap b{display:block;font-size:16px;font-weight:900;letter-spacing:-.03em}
.cf-cap span{display:block;font-size:12.5px;color:var(--ink3);margin-top:.2rem}
.cf-cap dl{margin:1rem auto 0;max-width:250px;font-size:12.5px}
.cf-cap dl div{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--line)}
.cf-cap dt{color:var(--ink3)}
.cf-cap dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.cf-dots{display:flex;justify-content:center;gap:.4rem;margin-top:1.1rem}
.cf-dots button{width:8px;height:8px;border-radius:999px;background:var(--ink);opacity:.25;transition:opacity 200ms}
.cf-dots button[aria-current="true"]{opacity:1}


/* 커버플로우 캡션 아래 CTA */
.cf-go{display:flex;justify-content:center;margin-top:1.1rem}

</style>

<header class="gnb"><div class="wrap gnb-in">
  <a class="lg" href="#/"><span class="g"></span>액상덕후</a>
  <nav>
   <a href="#/shop" data-k="shop">전체 상품</a>
   <a href="#/shop?f=멘솔" data-k="">멘솔</a>
   <a href="#/shop?b=액상덕후" data-k="">자체 제작</a>
   <a href="#/orders" data-k="orders">주문내역</a>
  </nav>
  <div class="sp">
   <a class="gi" href="#/shop" aria-label="상품 검색">⌕</a>

   <a class="gi who" id="who" href="#/login">로그인</a>
  </div>
 </div></header>

<main id="view"></main>

<nav class="tabs" aria-label="주요 메뉴">
 <a href="#/" data-k=""><i>⌂</i>홈</a>

</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dim" id="dim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
 <h3 id="mTitle"></h3><div id="mBody"></div>
 <div class="acts"><button class="btn btn-o" id="mCancel">닫기</button><button class="btn btn-p" id="mOk"></button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
if(window.gsap&&window.ScrollTrigger)gsap.registerPlugin(ScrollTrigger);
/* 커버플로우 — 21st.dev React 컴포넌트를 바닐라로 이식.
   각도/감쇠/투명도/관성 계산식은 원본과 동일하다. */
function coverflow(root, slides, opt={}){
  const o={rotate:44,depth:.6,perspective:3,falloff:.56,fade:.1,gap:.05,loop:true,...opt};
  const n=slides.length;
  root.innerHTML=`<div class="cf-frame" tabindex="0" role="region" aria-roledescription="carousel"
      aria-label="${o.label||'특가 캐러셀'}" style="perspective:calc(var(--cf-card) * ${o.perspective})">
      <div class="cf-track">${slides.map((s,i)=>`
        <div class="cf-card" role="group" aria-roledescription="slide" aria-label="${i+1} / ${n}">
          <div class="cf-img" style="background:${s.bg}"><span class="cf-btl" style="background:${s.c}"></span>
            <span class="cf-flag">${s.flag}</span></div>
        </div>`).join('')}</div></div>
    <div class="cf-cap" id="${root.id}-cap"></div>
    <div class="cf-dots">${slides.map((_,i)=>
      `<button type="button" data-g="${i}" aria-label="${i+1}번째로"></button>`).join('')}</div>`;

  const frame=root.querySelector('.cf-frame'), cards=[...root.querySelectorAll('.cf-card')];
  const cap=root.querySelector('.cf-cap'), dots=[...root.querySelectorAll('.cf-dots button')];
  let pos=0, target=0, w=0, raf=null, drag=null, sel=0;
  const idx=p=>((Math.round(p)%n)+n)%n;

  function paint(){
    if(!w) return;
    const pitch=w*(1+o.gap);
    cards.forEach((card,i)=>{
      let off=i-pos;
      if(o.loop){ off=((off%n)+n)%n; if(off>n/2) off-=n; }
      const d=Math.abs(off), ramp=Math.pow(d,o.falloff);
      const tilt=Math.min(o.rotate*ramp,82)*Math.sign(off);
      card.style.transform=`translateX(calc(-50% + ${off*pitch}px)) translateZ(${-o.depth*w*ramp}px) rotateY(${-tilt}deg)`;
      const edge=o.loop?Math.min(1,Math.max(0,n/2-d)):1;
      card.style.opacity=String(Math.max(0,1-o.fade*d)*edge);
      card.style.zIndex=String(100-Math.round(d));
    });
  }
  function caption(){
    const s=slides[sel];
    cap.innerHTML=`<b>${s.title}</b><span>${s.subtitle}</span>
      <dl>${s.meta.map(m=>`<div><dt>${m.label}</dt><dd>${m.value}</dd></div>`).join('')}</dl>`;
    dots.forEach((d,i)=>d.setAttribute('aria-current',i===sel));
    o.onSel&&o.onSel(sel);
  }
  function setSel(v){ if(v!==sel){ sel=v; caption(); } }
  function settle(t){
    if(raf) cancelAnimationFrame(raf);
    target=t; setSel(idx(t));
    (function step(){
      const rem=target-pos;
      if(Math.abs(rem)<.0004){ pos=target; paint(); raf=null; return; }
      pos+=rem*.16; paint(); raf=requestAnimationFrame(step);
    })();
  }
  const clamp=p=>o.loop?p:Math.max(0,Math.min(n-1,p));
  const goTo=i=>settle(clamp(o.loop?i+Math.round((target-i)/n)*n:i));
  const nudge=by=>settle(clamp(Math.round(target)+by));

  frame.addEventListener('pointerdown',e=>{
    if(raf){cancelAnimationFrame(raf);raf=null}
    frame.setPointerCapture(e.pointerId); target=pos;
    drag={id:e.pointerId,x:e.clientX,pos,v:0,t:performance.now()};
  });
  frame.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId) return;
    const pitch=w*(1+o.gap); if(!pitch) return;
    const now=performance.now(), prev=pos;
    pos=clamp(drag.pos-(e.clientX-drag.x)/pitch);
    drag.v=((pos-prev)/Math.max(now-drag.t,1))*1000; drag.t=now;
    setSel(idx(pos)); paint();
  });
  const end=e=>{
    if(!drag||drag.id!==e.pointerId) return;
    const carried=Math.max(-2,Math.min(2,drag.v*.18)); drag=null;
    settle(clamp(Math.round(pos+carried)));
  };
  frame.addEventListener('pointerup',end); frame.addEventListener('pointercancel',end);
  frame.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();nudge(-1)}
    else if(e.key==='ArrowRight'){e.preventDefault();nudge(1)}
  });
  root.querySelector('.cf-dots').addEventListener('click',e=>{
    const b=e.target.closest('button[data-g]'); if(b) goTo(+b.dataset.g);
  });
  const measure=()=>{ w=cards[0].offsetWidth; paint(); };
  new ResizeObserver(measure).observe(frame);
  measure(); caption();
  return {nudge,goTo};
}

/* ── 커버플로우 · 스크롤 연출 ── */
const HOT=()=>P.filter(p=>p.was||p.tag==='BEST'||p.tag==='신상');
function mountCF(){
 const root=document.getElementById('cf'); if(!root||typeof coverflow!=='function')return;
 const hot=HOT();
 const slides=hot.map(p=>({bg:p.t,c:p.c,flag:p.tag||p.nic[0],title:p.n,subtitle:p.b+' · '+p.f,
  meta:[{label:'병당 가격',value:won(p.p)+'원'},{label:'니코틴',value:p.nic.join(' / ')},{label:'용량',value:'30ml'}]}));
 coverflow(root,slides,{label:'9월 특가 캐러셀',onSel:i=>{
  const go=document.getElementById('cfGo');
  if(go){go.setAttribute('href','#/p/'+hot[i].id);go.textContent=hot[i].n.length>12?'이 상품 보기':hot[i].n+' 보기';}
 }});
}
/* 화면은 처음부터 다 보인다. 스크롤에 맞춰 살짝 올라올 뿐이다. */
function mountReveal(){
 if(!window.gsap||!window.ScrollTrigger||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 ScrollTrigger.getAll().forEach(t=>t.kill());
 document.querySelectorAll('#view .sec').forEach((el,i)=>{
  if(i===0)return;
  gsap.from(el,{y:22,duration:.55,ease:'power2.out',
   scrollTrigger:{trigger:el,start:'top 90%',once:true}});
 });
 ScrollTrigger.refresh();
}

/* ── 라우터 ── */
let state={bi:1,ni:0,joined:false};
function route(){
 const h=location.hash.slice(1)||'/';
 const [path,qs]=h.split('?');
 const q=new URLSearchParams(qs||'');
 const seg=path.split('/').filter(Boolean);
 let html;
 if(!seg.length)html=V.home();
 else if(seg[0]==='shop')html=V.shop(q);
 else if(seg[0]==='p'){state.bi=1;state.ni=0;html=V.p(seg[1])}
 else if(seg[0]==='cart')html=V.cart();
 else if(seg[0]==='checkout')html=V.checkout();
 else if(seg[0]==='done')html=V.done(+seg[1]);
 else if(seg[0]==='login')html=V.login();
 else if(seg[0]==='join')html=V.join();
 else if(seg[0]==='orders')html=V.orders();
 else if(seg[0]==='order')html=V.order(+seg[1]);
 else if(seg[0]==='my')html=V.my();
 else html=V.e404();
 $('#view').innerHTML=html;
 window.scrollTo(0,0);
 syncChrome(seg[0]||'');
 if(!seg.length)mountCF();
 mountReveal();
 if(window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
  gsap.fromTo('#view > *',{opacity:0,y:10},{opacity:1,y:0,duration:.3,ease:'power2.out'});
}
function syncChrome(k){
 $('#cartN').textContent=cartQty();
 $('#cartN').style.display=cartQty()?'flex':'none';
 $('#who').textContent=S.user?S.user.name:'로그인';
 $('#who').setAttribute('href',S.user?'#/my':'#/login');
 document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===(k||'')));
 document.querySelectorAll('.gnb nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(k||'')));
}
const rerender=()=>route();

/* ── 이벤트 ── */
document.addEventListener('click',e=>{
 const t=e.target;
 const flt=t.closest('[data-flt]'); if(flt){S.flt=flt.dataset.flt;rerender();return}
 const bi=t.closest('[data-bi]'); if(bi){state.bi=+bi.dataset.bi;rerender();return}
 const ni=t.closest('[data-ni]'); if(ni){state.ni=+ni.dataset.ni;rerender();return}
 const inc=t.closest('[data-inc]'); if(inc){const c=S.cart[+inc.dataset.inc];
  c.q+=c.per;c.pay+=c.unit;rerender();return}
 const dec=t.closest('[data-dec]'); if(dec){const i=+dec.dataset.dec,c=S.cart[i];
  if(c.q<=c.per){S.cart.splice(i,1)}else{c.q-=c.per;c.pay-=c.unit}rerender();return}
 const del=t.closest('[data-del]'); if(del){S.cart.splice(+del.dataset.del,1);rerender();toast('삭제했습니다');return}
 const a=t.closest('[data-act]'); if(!a)return;
 const act=a.dataset.act;

 if(act==='cart'||act==='buy'){
  const pid=+location.hash.split('/')[2],p=find(pid),b=BUNDLES[state.bi];
  const pay=(b.mult||b.q)*p.p;
  S.cart.push({pid,bundle:b.k,nic:p.nic[state.ni],q:b.q,per:b.q,unit:pay,pay});
  if(act==='cart'){syncChrome(location.hash.split('/')[1]);toast('장바구니에 담았습니다')}
  else location.hash='#/checkout';
  return;
 }
 if(act==='copy'){toast('계좌번호를 복사했습니다');return}
 if(act==='login'){
  const id=$('#lId').value.trim()||'duckhoo';
  S.user={id,name:'홍길동',tel:'010-0000-0000'};
  toast('로그인했습니다');
  location.hash=a.dataset.next?'#/'+a.dataset.next:'#/my'; rerender(); return;
 }
 if(act==='pass'){
  modal('PASS 본인확인','<p>실제 사이트에서는 여기서 PASS 앱 인증창이 열립니다. 데모에서는 통과한 것으로 처리합니다.</p>',
   '인증 완료',()=>{state.joined=true;rerender();toast('본인확인이 완료됐습니다')});
  return;
 }
 if(act==='join'){
  const name=$('#jName').value.trim()||'홍길동';
  S.user={id:$('#jId').value.trim()||'duckhoo',name,tel:$('#jTel').value.trim()};
  state.joined=false; location.hash='#/my'; rerender(); toast('가입이 완료됐습니다'); return;
 }
 if(act==='order'){
  const dep=$('#oDep').value.trim(),name=$('#oName').value.trim();
  const id=++S.seq, sum=cartSum(), sh=ship();
  /* 입금자명이 주문자명과 다르면 확인필요로 들어간다 — 실제 매칭 규칙 그대로 */
  const st=dep===name?'pend':'chk';
  S.orders.unshift({id,st,date:'2026.09.02',items:S.cart.slice(),sum,ship:sh,total:sum+sh,depositor:dep});
  S.cart=[]; location.hash='#/done/'+id; rerender();
  if(st==='chk')toast('입금자명이 주문자명과 달라 확인필요로 접수됐습니다');
  return;
 }
 if(act==='cancel'){
  const oid=+a.dataset.oid;
  modal('주문을 취소할까요?','<p>취소하면 되돌릴 수 없습니다. 이미 입금하셨다면 환불까지 1~2일 걸립니다.</p>',
   '주문 취소',()=>{S.orders=S.orders.filter(o=>o.id!==oid);location.hash='#/orders';rerender();
    toast('주문이 취소됐습니다')},true);
  return;
 }
 if(act==='logout'){S.user=null;location.hash='#/';rerender();toast('로그아웃했습니다');return}
 if(act==='leave'){
  /* 실제 사이트와 같은 규칙: 끝나지 않은 주문이 있거나 적립금이 남아 있으면 막는다.
     계정을 지우지는 않는다 — 로그인을 끊고 개인정보만 지운다. 주문 기록은 5년 보존이다. */
  const stop=leaveBlockers();
  if(stop.length){
   modal('지금은 탈퇴할 수 없습니다',
    '<ul style="margin:0;padding-left:1.1rem">'+stop.map(r=>`<li>${r}</li>`).join('')+'</ul>',
    '알겠습니다',null);
   return;
  }
  modal('정말 탈퇴하시겠어요?',
   '<p>탈퇴하면 로그인할 수 없게 되고 이름·연락처·주소가 지워집니다. 되돌릴 수 없습니다.</p>'+
   '<p style="margin-top:.6rem">주문 기록은 남습니다. 전자상거래법상 거래기록은 5년간 보관해야 합니다.</p>',
   '탈퇴하기',()=>{S={user:null,cart:[],orders:[],flt:'전체',seq:S.seq,points:0};
    location.hash='#/';rerender();toast('탈퇴가 완료됐습니다')},true);
  return;
 }
});
