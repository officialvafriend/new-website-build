/* ── 앱 껍데기 ──
   문서는 스크롤하지 않는다. 화면 높이를 고정하고 #view 안에서만 스크롤한다.
   문서가 스크롤하면 모바일 브라우저 주소창이 접혔다 펴지며 뷰포트 높이가 바뀌고,
   그때마다 아래 탭바가 같이 움직인다. 안에서만 스크롤하면 그 일이 없다. */
html{height:100%}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
 background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
 word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
 overscroll-behavior:contain;scroll-behavior:auto}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.035em;font-weight:800;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--acdeep);outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
.n,.pill,.chip .c,.opt .d,.acct .v b,.gi .b,.tabs a .b{font-variant-numeric:tabular-nums}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ── 헤더 ── 큰 제목이 스크롤로 올라가면 작은 제목이 가운데에 나타난다 */
.gnb{flex:0 0 auto;position:relative;z-index:30;background:var(--bg);border-bottom:1px solid transparent;
 transition:border-color 200ms var(--ez),background 200ms var(--ez)}
.gnb.small{background:var(--sf);border-bottom-color:var(--line)}
.gnb-in{display:flex;align-items:center;gap:.6rem;height:var(--gnb);position:relative}
.lg{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:17px;letter-spacing:-.05em;min-height:44px}
.lg .g{width:20px;height:20px;border-radius:50% 50% 50% 4px;background:var(--ink)}
/* 긴 상품명이 오른쪽 아이콘을 덮지 않게 폭을 자른다 */
.ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);font-size:16px;font-weight:800;letter-spacing:-.02em;
 opacity:0;pointer-events:none;transition:opacity 180ms var(--ez),transform 220ms var(--ez);white-space:nowrap;
 max-width:min(44vw,300px);overflow:hidden;text-overflow:ellipsis}
/* 데스크톱은 그 자리에 검색창이 있다. 작은 제목은 모바일 것이다. */
@media(min-width:880px){.ttl{display:none}}
.gnb.small .ttl{opacity:1;transform:translate(-50%,-50%)}
.gnb nav{display:none;gap:.2rem;margin-left:.6rem}
@media(min-width:880px){.gnb nav{display:flex}}
.gnb nav a{font-size:14px;color:var(--ink2);font-weight:600;padding:.5rem .7rem;border-radius:10px;min-height:44px;display:flex;align-items:center}
.gnb nav a:hover{background:var(--sf2)}
.gnb nav a.on{color:var(--ink)}
.gnb .sp{margin-left:auto;display:flex;gap:.1rem;align-items:center}
.gi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.gi:hover{background:var(--sf2)}
.gi svg{width:23px;height:23px;stroke-width:2.1}
.gi .b{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--ac);
 color:var(--acink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.who{width:36px;height:36px;border-radius:999px;background:var(--acsoft);color:var(--acdeep);font-size:13px;font-weight:800;
 display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;margin-left:.25rem}
.who.in{background:var(--ink);color:#fff}

/* ── 아래 탭 (모바일) ── 흐름 안의 플렉스 아이템이다. fixed 도 sticky 도 아니다. */
.tabs{flex:0 0 auto;display:flex;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:880px){.tabs{display:none}}
.tabs a{flex:1 1 0;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:-.01em;position:relative}
.tabs a svg{width:25px;height:25px;stroke-width:1.9;transition:transform 200ms var(--ez)}
.tabs a.on{color:var(--acdeep)}
.tabs a.on svg{fill:var(--acsoft);stroke-width:2.2}
.tabs a:active svg{transform:scale(.9)}
.tabs a .b{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;
 background:var(--ac);color:var(--acink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ── 공통 ── */
.sec{padding:clamp(1.6rem,3vw,2.6rem) 0 0}
.sec-h{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}
.sec-h h2{font-size:clamp(1.35rem,1.15rem + 1vw,1.75rem)}
.sec-h .sub{font-size:14px;color:var(--ink3);font-weight:500}
.lk{font-size:15px;color:var(--acdeep);font-weight:700;display:inline-flex;align-items:center;gap:.1rem;min-height:44px}
.lk svg{width:18px;height:18px;stroke-width:2.4}
.lk:hover{text-decoration:underline}
.big{font-size:clamp(2rem,1.5rem + 2.4vw,2.6rem);font-weight:900;letter-spacing:-.045em;line-height:1.1}
.btn{min-height:48px;border-radius:999px;padding:0 1.35rem;font-size:16px;font-weight:800;display:inline-flex;
 align-items:center;justify-content:center;gap:.4rem;letter-spacing:-.01em;transition:filter 160ms var(--ez),transform 160ms var(--ez)}
.btn svg{width:20px;height:20px;stroke-width:2.4}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ac);color:var(--acink)}
.btn-p:hover{filter:brightness(1.06)}
.btn-d{background:var(--ink);color:#fff}
.btn-o{background:var(--sf);color:var(--ink);border:1.5px solid var(--line2)}
.btn-o:hover{border-color:var(--ink)}
.btn-w{width:100%}
.btn-dg{background:var(--sf);color:var(--chk);border:1.5px solid #E9B4AF}
.btn-sm{min-height:42px;font-size:14px;padding:0 1rem}
.crumb{font-size:13px;color:var(--ink3);padding-top:1rem;font-weight:500}
.crumb a{color:var(--ink3)}
.pagetitle{font-size:clamp(1.9rem,1.5rem + 1.8vw,2.4rem);font-weight:900;letter-spacing:-.045em;margin:.4rem 0 1.1rem}
.lead{font-size:16px;color:var(--ink2);line-height:1.6;max-width:36rem}

/* ── 분류 타일 (가로 스크롤) ── */
.tiles{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.4rem 0 1rem;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut)}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:150px;background:var(--sf);border-radius:var(--r);padding:1.1rem .9rem 1rem;scroll-snap-align:start;
 display:flex;flex-direction:column;align-items:center;gap:.7rem;transition:transform 200ms var(--ez)}
.tile:hover{transform:translateY(-3px)}
.tile .art{height:96px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.tile .art .btl{width:30px;height:64px;box-shadow:0 8px 16px -10px rgba(0,0,0,.4)}
.tile .art .btl::before{width:11px;height:8px;top:-7px}
.tile .art .btl::after{left:5px;right:5px;bottom:9px;height:17px}
.tile .art .btl:nth-child(2){height:74px;width:34px}
.tile b{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink3);font-weight:500;margin-top:-.4rem}

/* ── 상품 카드 (레퍼런스: 이미지 · 아이브로 · 찜 · 이름 · 평점 · 가격) ── */
.grid{display:grid;gap:.85rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--sf);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;
 transition:transform 200ms var(--ez),box-shadow 200ms var(--ez);text-align:left}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -28px rgba(17,17,17,.35)}
.card .fig{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;margin:.6rem;border-radius:var(--r2)}
.card.is-out .fig{filter:saturate(.25) opacity(.7)}
.eb{position:absolute;top:.7rem;left:.7rem;font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--acdeep)}
.eb.out{color:var(--ink3)}.eb.sale{color:#B45309}.eb.best{color:#9F1239}.eb.own{color:var(--ink2)}
.wish{position:absolute;top:1rem;right:1rem;width:40px;height:40px;border-radius:999px;background:var(--sf);display:flex;
 align-items:center;justify-content:center;color:var(--ink2);box-shadow:0 4px 12px -6px rgba(0,0,0,.25);z-index:2;transition:transform 150ms var(--ez)}
.wish svg{width:20px;height:20px;stroke-width:2.1}
.wish:hover{transform:scale(1.08)}
.wish.on{color:#E11D48}.wish.on svg{fill:#E11D48;stroke:#E11D48}
.btl{width:60px;height:100px;border-radius:10px 10px 14px 14px;position:relative;box-shadow:0 10px 22px -12px rgba(0,0,0,.45)}
.btl::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:21px;height:15px;
 border-radius:4px 4px 0 0;background:inherit;filter:brightness(.78)}
.btl::after{content:"";position:absolute;left:9px;right:9px;bottom:15px;height:28px;border-radius:5px;background:rgba(255,255,255,.6)}
.card .bd{padding:.2rem .95rem 1rem;display:flex;flex-direction:column;gap:.25rem;flex:1 1 auto}
.card .nm{font-size:15.5px;font-weight:700;line-height:1.35;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.meta{display:flex;align-items:center;gap:.3rem;font-size:13.5px;color:var(--ink3);font-weight:500}
.meta b{color:var(--ink);font-weight:700}
.star{color:#F59E0B;font-size:13px}
.pr{margin-top:auto;padding-top:.35rem;display:flex;align-items:baseline;gap:.35rem;flex-wrap:wrap}
.pr b{font-size:18px;font-weight:800;letter-spacing:-.025em}
.pr s{color:var(--ink3);font-weight:500;font-size:13.5px;margin-right:.35rem}
.pr small{font-size:13px;color:var(--ink3);font-weight:500}
.scroller{display:flex;gap:.75rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.3rem 0 1rem;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut)}
.scroller::-webkit-scrollbar{display:none}
.scroller .card{flex:0 0 auto;width:min(62vw,230px);scroll-snap-align:start}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{min-height:46px;padding:0 1.05rem;border-radius:999px;border:1.5px solid transparent;background:var(--sf);font-size:15px;
 font-weight:700;display:inline-flex;align-items:center;gap:.4rem;letter-spacing:-.01em;transition:transform 150ms var(--ez)}
.chip:active{transform:scale(.97)}
.chip .c{font-size:13px;color:var(--ink3);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .c{color:rgba(255,255,255,.6)}
.chips-x{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 1rem;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut)}
.chips-x::-webkit-scrollbar{display:none}
.chips-x .chip{flex:0 0 auto}
.filters{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:1rem;margin:0 calc(-1 * var(--gut));padding-inline:var(--gut)}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}

/* ── 폼 ── */
.field{margin-bottom:1rem}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:.4rem}
.field input,.field select,.field textarea{width:100%;min-height:50px;border:1.5px solid var(--line2);border-radius:13px;
 padding:.7rem .95rem;background:var(--sf);transition:border-color 160ms var(--ez),box-shadow 160ms var(--ez)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acdeep);box-shadow:0 0 0 3px var(--acsoft);outline:none}
.field .hint{font-size:13.5px;color:var(--ink3);margin-top:.4rem;line-height:1.5}
.field.key{background:var(--acsoft);border:1.5px solid var(--ac);border-radius:16px;padding:1rem}
.field.key label{color:var(--ink)}
.field.key .hint{color:#0E4F86}
.err{font-size:13px;color:var(--chk);margin-top:.3rem;font-weight:700}
.panel{background:var(--sf);border-radius:var(--r);padding:1.2rem}
.panel + .panel{margin-top:.75rem}
.panel h3{font-size:17px;margin-bottom:.75rem}
.note{background:var(--acsoft);border-left:3px solid var(--ac);border-radius:0 12px 12px 0;padding:.85rem .95rem;
 font-size:14px;line-height:1.6;color:#0E4F86}
.note b{color:#0B3D66}
.warnbox{background:#FEF3F2;border:1px solid #F3C7C2;border-radius:16px;padding:1rem;font-size:14px;color:#7A2019;line-height:1.6}
.warnbox b{color:#5E1512}

/* ── 상태 배지 ── */
.st{display:inline-flex;align-items:center;gap:.3rem;font-size:13px;font-weight:800;padding:.3rem .7rem;border-radius:999px;
 border:1.5px solid currentColor}
.st.pend{color:var(--pend)}.st.chk{color:var(--chk)}.st.paid{color:var(--paid)}
.st.ship{color:var(--ship)}.st.done{color:var(--done)}

/* ── 목록 행 ── */
.lrow{display:flex;gap:.85rem;padding:.9rem 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.lthumb{flex:0 0 66px;width:66px;height:66px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.lthumb .btl{width:26px;height:44px}
.lthumb .btl::before{width:10px;height:7px;top:-6px}
.lthumb .btl::after{left:4px;right:4px;bottom:7px;height:12px}
.lbody{flex:1 1 auto;min-width:0}
.lbody .t{font-size:15px;font-weight:700;line-height:1.4}
.lbody .s{font-size:13.5px;color:var(--ink3);margin-top:.15rem;font-weight:500}
.lend{flex:0 0 auto;text-align:right}
.lend b{font-size:15.5px;font-weight:900}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:11px;overflow:hidden;margin-top:.4rem;background:var(--sf)}
.qty button{width:38px;height:38px;font-size:17px;font-weight:700}
.qty button:hover{background:var(--sf2)}
.qty span{min-width:34px;text-align:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── 합계 ── */
.totals{margin-top:1rem;background:var(--sf);border-radius:var(--r);padding:1.1rem 1.2rem}
.totals div{display:flex;justify-content:space-between;font-size:15px;padding:.3rem 0;color:var(--ink2);font-weight:500}
.totals div.big{border-top:1px solid var(--line);margin-top:.5rem;padding-top:.8rem;color:var(--ink);font-size:16px;font-weight:700}
.totals div.big b{font-size:24px;font-weight:900;letter-spacing:-.035em}

/* ── 상품 상세 ── */
.pd{display:grid;gap:1.2rem;grid-template-columns:1fr}
@media(min-width:900px){.pd{grid-template-columns:1.05fr .95fr;gap:2rem;align-items:start}}
.pd-fig{aspect-ratio:1/1;border-radius:26px;display:flex;align-items:center;justify-content:center;position:relative}
.pd-fig .btl{width:34%;height:56%}
.pd-fig .btl::before{width:36%;height:13%;top:-11%}
.pd-fig .btl::after{left:16%;right:16%;bottom:20%;height:26%}
.pd-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.6rem}
.pd-thumbs button{aspect-ratio:1/1;border-radius:14px;border:2px solid transparent}
.pd-thumbs button.on{border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:.45rem}
.opt{display:flex;align-items:center;gap:.7rem;padding:.8rem .95rem;border:1.5px solid var(--line);border-radius:15px;
 text-align:left;min-height:58px;width:100%;background:var(--sf)}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--ink);background:var(--sf)}
.opt .l{flex:1 1 auto;min-width:0}
.opt .l b{display:block;font-size:15px;font-weight:800}
.opt .l span{display:block;font-size:13px;color:var(--ink3);margin-top:.1rem;font-weight:500}
.opt .d{font-size:15px;color:var(--ink2);font-weight:600;letter-spacing:-.01em}
.opt.on .d{color:var(--ink);font-weight:700}
.buybar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);
 padding:.8rem 0;display:flex;gap:.5rem;margin-top:1rem;z-index:20}
@media(min-width:880px){.buybar{position:static;border:0;padding-top:1rem}}
.buybar .btn{flex:1 1 0}
.buybar .btn.main{flex:1.5 1 0}

/* ── 스텝 ── */
.steps{display:flex;gap:.45rem;margin-bottom:1.3rem}
.steps div{flex:1 1 0;font-size:13px;font-weight:700;color:var(--ink3);text-align:center;padding-top:.55rem;
 border-top:3px solid var(--line2)}
.steps div.on{color:var(--ink);border-top-color:var(--ink)}
.acct{background:var(--sf2);border-radius:16px;padding:1rem;display:flex;align-items:center;gap:.7rem;margin-top:.7rem}
.acct .v{flex:1 1 auto;min-width:0}
.acct .v b{display:block;font-size:16px;font-weight:700;letter-spacing:.01em}
.acct .v span{font-size:13.5px;color:var(--ink3);font-weight:500}
.big-ok{text-align:center;padding:2.5rem 0 1rem}
.big-ok .ico{width:72px;height:72px;border-radius:999px;background:var(--ac);color:var(--acink);display:flex;
 align-items:center;justify-content:center;margin:0 auto 1.1rem}
.big-ok .ico svg{width:36px;height:36px;stroke-width:2.6}
.mine{display:grid;gap:.6rem;grid-template-columns:repeat(2,1fr);margin-top:1rem}
@media(min-width:720px){.mine{grid-template-columns:repeat(4,1fr)}}
.mine a{background:var(--sf);border-radius:var(--r2);padding:1.1rem 1rem;text-align:center;font-size:14.5px;font-weight:700;
 display:flex;flex-direction:column;align-items:center;gap:.5rem}
.mine a svg{width:26px;height:26px;stroke-width:1.9}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 1rem + env(safe-area-inset-bottom));transform:translate(-50%,40%);
 opacity:0;visibility:hidden;pointer-events:none;
 z-index:60;background:var(--ink);color:#fff;font-size:15px;font-weight:700;padding:.85rem 1.25rem;border-radius:999px;
 transition:transform 300ms var(--ez),opacity 220ms var(--ez),visibility 0s 300ms;max-width:90vw;text-align:center;letter-spacing:-.01em}
@media(min-width:880px){.toast{bottom:1.5rem}}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform 300ms var(--ez),opacity 220ms var(--ez),visibility 0s}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity 240ms var(--ez);z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;z-index:50;
 background:var(--sf);border-radius:24px;padding:1.5rem;width:min(92vw,420px);transition:all 240ms var(--ez)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:20px;margin-bottom:.7rem}
.modal p,.modal li{font-size:15px;color:var(--ink2);line-height:1.65}
.modal .acts{display:flex;gap:.5rem;margin-top:1.3rem}
.modal .acts .btn{flex:1 1 0}
.empty{text-align:center;padding:3rem 1rem;color:var(--ink3)}
.empty .ico{width:64px;height:64px;border-radius:999px;background:var(--sf);display:flex;align-items:center;justify-content:center;margin:0 auto .9rem}
.empty .ico svg{width:30px;height:30px;stroke-width:1.8}
.empty p{font-size:15.5px;margin-bottom:1.2rem;font-weight:500}

/* ── 검색 ── */
.sfield{display:flex;align-items:center;gap:.5rem;background:var(--sf);border-radius:999px;
 padding:0 .35rem 0 1rem;min-height:54px;margin-bottom:1.1rem;color:var(--ink3)}

/* 커버플로우 — 21st.dev React 컴포넌트를 바닐라로 이식.

function coverflow(root, slides, opt={}){
  const o={rotate:44,depth:.6,perspective:3,falloff:.56,fade:.1,gap:.05,loop:true,...opt};
  const n=slides.length;
  root.innerHTML=`<div class="cf-frame" tabindex="0" role="region" aria-roledescription="carousel"
      aria-label="${o.label||'특가 캐러셀'}" style="perspective:calc(var(--cf-card) * ${o.perspective})">

        <div class="cf-card" role="group" aria-roledescription="slide" aria-label="${i+1} / ${n}">
          <div class="cf-img" style="background:${s.bg}"><span class="cf-btl" style="background:${s.c}"></span>
            <span class="cf-flag">${s.flag}</span></div>
        </div>`).join('')}</div></div>
    <div class="cf-cap" id="${root.id}-cap"></div>
    <div class="cf-dots">${slides.map((_,i)=>
      `<button type="button" data-g="${i}" aria-label="${i+1}번째로"></button>`).join('')}</div>`;

  const frame=root.querySelector('.cf-frame'), cards=[...root.querySelectorAll('.cf-card')];
  const cap=root.querySelector('.cf-cap'), dots=[...root.querySelectorAll('.cf-dots button')];
  let pos=0, target=0, w=0, raf=null, drag=null, sel=0;
  const idx=p=>((Math.round(p)%n)+n)%n;

  function paint(){
    if(!w) return;
    const pitch=w*(1+o.gap);
    cards.forEach((card,i)=>{
      let off=i-pos;
      if(o.loop){ off=((off%n)+n)%n; if(off>n/2) off-=n; }
      const d=Math.abs(off), ramp=Math.pow(d,o.falloff);
      const tilt=Math.min(o.rotate*ramp,82)*Math.sign(off);
      card.style.transform=`translateX(calc(-50% + ${off*pitch}px)) translateZ(${-o.depth*w*ramp}px) rotateY(${-tilt}deg)`;
      const edge=o.loop?Math.min(1,Math.max(0,n/2-d)):1;
      card.style.opacity=String(Math.max(0,1-o.fade*d)*edge);
      card.style.zIndex=String(100-Math.round(d));
    });
  }
  function caption(){
    const s=slides[sel];
    cap.innerHTML=`<b>${s.title}</b><span>${s.subtitle}</span>
      <dl>${s.meta.map(m=>`<div><dt>${m.label}</dt><dd>${m.value}</dd></div>`).join('')}</dl>`;
    dots.forEach((d,i)=>d.setAttribute('aria-current',i===sel));
    o.onSel&&o.onSel(sel);
  }
  function setSel(v){ if(v!==sel){ sel=v; caption(); } }
  function settle(t){
    if(raf) cancelAnimationFrame(raf);
    target=t; setSel(idx(t));
    (function step(){
      const rem=target-pos;
      if(Math.abs(rem)<.0004){ pos=target; paint(); raf=null; return; }
      pos+=rem*.16; paint(); raf=requestAnimationFrame(step);
    })();
  }
  const clamp=p=>o.loop?p:Math.max(0,Math.min(n-1,p));
  const goTo=i=>settle(clamp(o.loop?i+Math.round((target-i)/n)*n:i));
  const nudge=by=>settle(clamp(Math.round(target)+by));

  frame.addEventListener('pointerdown',e=>{
    if(raf){cancelAnimationFrame(raf);raf=null}
    frame.setPointerCapture(e.pointerId); target=pos;
    drag={id:e.pointerId,x:e.clientX,pos,v:0,t:performance.now()};
  });
  frame.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId) return;
    const pitch=w*(1+o.gap); if(!pitch) return;
    const now=performance.now(), prev=pos;
    pos=clamp(drag.pos-(e.clientX-drag.x)/pitch);
    drag.v=((pos-prev)/Math.max(now-drag.t,1))*1000; drag.t=now;
    setSel(idx(pos)); paint();
  });
  const end=e=>{
    if(!drag||drag.id!==e.pointerId) return;
    const carried=Math.max(-2,Math.min(2,drag.v*.18)); drag=null;
    settle(clamp(Math.round(pos+carried)));
  };
  frame.addEventListener('pointerup',end); frame.addEventListener('pointercancel',end);
  frame.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();nudge(-1)}
    else if(e.key==='ArrowRight'){e.preventDefault();nudge(1)}
  });
  root.querySelector('.cf-dots').addEventListener('click',e=>{
    const b=e.target.closest('button[data-g]'); if(b) goTo(+b.dataset.g);
  });
  const measure=()=>{ w=cards[0].offsetWidth; paint(); };
  new ResizeObserver(measure).observe(frame);
  measure(); caption();
  return {nudge,goTo};
}

</script>

 if(!b&&!n&&S.flt!=='전체')list=list.filter(p=>p.f===S.flt);
 const title=b?esc(b):n?(n==='0mg'?'무니코틴':n==='0.98mg'?'저농도 0.98mg':'고농도 9.8mg'):'전체 상품';
 return `<div class="wrap"><div class="crumb"><a href="#/">홈</a> › 상품</div>

   <div class="pdx-hero" style="--fc:${p.c}"><span class="btl" style="background:${p.c}"></span>

V.order=oid=>{
 const o=S.orders.find(x=>x.id===oid); if(!o)return V.e404();
 /* 취소는 입금전 하나뿐이다. 확인필요부터는 돈이 이미 들어와 있어 사람이 봐야 한다. */
 const canCancel=o.st==='pend';
 const why=o.st==='chk'?'입금자명 확인 중이라 직접 취소할 수 없습니다.'
  :o.st==='paid'?'입금이 확인된 주문은 직접 취소할 수 없습니다.'
  :'배송이 시작된 주문은 직접 취소할 수 없습니다.';
 return `<div class="wrap"><div class="crumb"><a href="#/orders">주문내역</a> › #${o.id}</div>
 <h1 class="pagetitle">주문 상세</h1>
 <div class="panel"><div style="display:flex;align-items:center;gap:.6rem">
  ${stBadge(o.st)}<span style="margin-left:auto;font-size:13.5px;color:var(--ink3);font-weight:600">${o.date}</span></div>
  ${o.st==='pend'?`<div class="note" style="margin-top:.8rem">입금자명 <b>${esc(o.depositor)}</b> 으로
   <b>${won(o.total)}원</b> 입금해 주세요.</div>`:''}
  ${o.st==='chk'?`<div class="warnbox" style="margin-top:.8rem"><b>입금자명이 주문자명과 다릅니다.</b>
   확인에 시간이 걸립니다. 카카오톡으로 문의해 주시면 빠르게 처리됩니다.</div>`:''}</div>
 <div class="panel">${o.items.map(c=>{const p=find(c.pid);return `<div class="lrow">
  <span class="lthumb" style="background:${p.t}"><span class="btl" style="background:${p.c}"></span></span>
  <span class="lbody"><span class="t">${esc(p.n)}</span><span class="s">${c.bundle} · ${c.nic} · ${c.q}병</span></span>
  <span class="lend"><b class="n">${won(c.pay)}원</b></span></div>`}).join('')}</div>
 <div class="totals"><div><span>상품 금액</span><span class="n">${won(o.sum)}원</span></div>
  <div><span>배송비</span><span class="n">${o.ship?won(o.ship)+'원':'무료'}</span></div>
  <div class="big"><span>결제 금액</span><b class="n">${won(o.total)}원</b></div></div>
 <div style="margin-top:1.2rem;display:flex;gap:.5rem;flex-wrap:wrap">
  ${canCancel?`<button class="btn btn-dg" style="flex:1" data-act="cancel" data-oid="${o.id}">주문 취소</button>`
   :`<button class="btn btn-o" style="flex:1" disabled title="${why}">주문 취소</button>`}
  <a class="btn btn-o" style="flex:1" href="#/orders">목록으로</a></div>
 ${canCancel?'':`<p style="font-size:13.5px;color:var(--ink3);margin-top:.6rem">
  ${why} 카카오톡으로 문의해 주세요.</p>`}
 <div style="height:2rem"></div></div>`;
};

/* 검색 — 이름·브랜드·맛·니코틴을 한 덩어리로 놓고 본다.
   무니코틴처럼 사람이 쓰는 말이 데이터에 없을 때가 있어 그건 따로 붙여 준다. */
const hay=p=>[p.n,p.b,p.f,p.nic.join(' '),p.nic[0]==='0mg'?'무니코틴 노니코틴':'',p.was?'특가 세일 9월':'',p.tag||'']
 .join(' ').toLowerCase().replace(/\s+/g,'');
const searchHits=q=>{
 const k=q.trim().toLowerCase().replace(/\s+/g,'');
 if(!k)return [];
 return P.filter(p=>hay(p).includes(k));
};
const SKW=['무니코틴','멘솔','9.8mg','액상덕후','청포도','9월 특가'];

const searchBody=q=>{
 if(!q.trim())return `<div class="skw">${SKW.map(k=>`<button class="chip" data-kw="${k}">${k}</button>`).join('')}</div>
  <div class="sec-h" style="margin-top:.4rem"><h2 style="font-size:1.05rem">많이 찾는 상품</h2></div>
  <div class="grid">${P.filter(p=>p.tag).map(card).join('')}</div>`;
 const hits=searchHits(q);
 if(!hits.length)return `<div class="empty"><div class="ico">${I.search}</div>
  <p><b>${esc(q)}</b> 에 맞는 상품이 없습니다.<br>브랜드나 맛으로 다시 찾아보세요.</p>
  <div class="skw" style="justify-content:center">${SKW.map(k=>`<button class="chip" data-kw="${k}">${k}</button>`).join('')}</div></div>`;
 return `<p style="font-size:14px;color:var(--ink3);margin-bottom:.8rem">${hits.length}종</p>
  <div class="grid">${hits.map(card).join('')}</div>`;
};

V.search=()=>`<div class="wrap"><div class="crumb"><a href="#/">홈</a> › 검색</div>
 <h1 class="pagetitle">검색</h1>
 <form class="sfield" id="sform" role="search">
  ${I.search}
  <input id="sq" type="search" enterkeyhint="search" autocomplete="off"
   placeholder="상품명 · 브랜드 · 맛 · 니코틴" aria-label="상품 검색" value="${esc(S.q)}">
  ${S.q?`<button type="button" class="x" data-kw="" aria-label="검색어 지우기">${I.x}</button>`:''}
 </form>
 <div id="sres">${searchBody(S.q)}</div><div style="height:2rem"></div></div>`;

V.e404=()=>`<div class="wrap"><div class="empty"><div class="ico">${I.spark}</div>
 <p>페이지를 찾을 수 없습니다.</p><a class="btn btn-p" href="#/">홈으로</a></div></div>`;


/* ── 커버플로우 · 스크롤 연출 ── */
const HOT=()=>P.filter(p=>p.was||p.tag==='BEST'||p.tag==='신상');
function mountCF(){
 const root=document.getElementById('cf'); if(!root||typeof coverflow!=='function')return;
 const hot=HOT();
 const slides=hot.map(p=>({bg:p.t,c:p.c,flag:p.tag||p.nic[0],title:p.n,subtitle:p.b+' · '+p.f,
  meta:[{label:'병당 가격',value:won(p.p)+'원'},{label:'니코틴',value:p.nic.join(' / ')},{label:'용량',value:'30ml'}]}));
 coverflow(root,slides,{label:'9월 특가 캐러셀',onSel:i=>{
  const go=document.getElementById('cfGo');
  if(go){go.setAttribute('href','#/p/'+hot[i].id);go.innerHTML=(hot[i].n.length>12?'이 상품 보기':hot[i].n+' 보기')+' '+I.arrow;}
 }});
}
/* 화면은 처음부터 다 보인다. 스크롤에 맞춰 살짝 올라오고, 큰 카드의 병은 반대로 흐른다.
   스크롤러는 문서가 아니라 #view 다. */
function mountMotion(){
 if(!window.gsap||!window.ScrollTrigger||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 ScrollTrigger.getAll().forEach(t=>t.kill());
 document.querySelectorAll('#view .sec').forEach((el,i)=>{
  gsap.from(el,{y:22,duration:.55,ease:'power2.out',scrollTrigger:{trigger:el,scroller:'#view',start:'top 92%',once:true}});
 });
 document.querySelectorAll('#view .feat').forEach(card=>{
  const btl=card.querySelector('[data-px]'); if(!btl)return;
  gsap.fromTo(btl,{y:-36,rotate:-4},{y:36,rotate:4,ease:'none',
   scrollTrigger:{trigger:card,scroller:'#view',start:'top bottom',end:'bottom top',scrub:.6}});
 });
 ScrollTrigger.refresh();
}

/* ── 라우터 ── */
let state={bi:1,ni:0,joined:false};
function route(){
 const h=location.hash.slice(1)||'/';
 const [path,qs]=h.split('?');
 const q=new URLSearchParams(qs||'');
 const seg=path.split('/').filter(Boolean);
 let html;
 if(!seg.length)html=V.home();
 else if(seg[0]==='shop')html=V.shop(q);
 else if(seg[0]==='p'){state.bi=1;state.ni=0;html=V.p(seg[1])}
 else if(seg[0]==='cart')html=V.cart();
 else if(seg[0]==='checkout')html=V.checkout();
 else if(seg[0]==='done')html=V.done(+seg[1]);
 else if(seg[0]==='login')html=V.login();
 else if(seg[0]==='join')html=V.join();
 else if(seg[0]==='orders')html=V.orders();
 else if(seg[0]==='order')html=V.order(+seg[1]);
 else if(seg[0]==='search'){if(q.has('q'))S.q=q.get('q');html=V.search()}
 else if(seg[0]==='my')html=V.my();
 else html=V.e404();
 $('#view').innerHTML=html;
 $('#view').scrollTo(0,0);
 clearInterval(tick); tick=null;
 if(!seg.length){tick=setInterval(()=>{const el=$('#left'); if(el)el.textContent=leftText(); else clearInterval(tick)},1000)}
 /* 큰 제목이 올라가면 헤더 가운데에 작은 제목이 뜬다 */
 const big=$('#view h1');
 const bt=big?big.textContent.replace(/\s+/g,' ').trim().slice(0,18):'';
 $('#ttl').textContent=(!seg.length||bt==='액상덕후')?'':bt; /* 홈은 로고가 이미 그 말이다 */
 $('.gnb').classList.remove('small');
 syncChrome(seg[0]||'');
 if(!seg.length)mountCF();
 mountMotion();
 if(seg[0]==='search'){const i=$('#sq'); if(i){const v=i.value;i.focus();i.setSelectionRange(v.length,v.length)}}
 if(window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
  gsap.fromTo('#view > *',{opacity:0,y:10},{opacity:1,y:0,duration:.3,ease:'power2.out'});
}
function syncChrome(k){
 $('#cartN').textContent=cartQty();
 $('#cartN').style.display=cartQty()?'flex':'none';
 const cl=$('#cartL'); if(cl)cl.textContent=cartQty()?cartQty()+'병':'장바구니';
 const who=$('#who');
 who.innerHTML=S.user?esc(S.user.name.slice(0,1)):I.user;
 who.classList.toggle('in',!!S.user);
 who.setAttribute('href',S.user?'#/my':'#/login');
 who.setAttribute('aria-label',S.user?S.user.name+' 마이페이지':'로그인');
 const tb=$('#tabN'); if(tb){tb.textContent=cartQty();tb.style.display=cartQty()?'flex':'none'}
 document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===(k||'')));
 document.querySelectorAll('.gnb nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(k||'')));
}
const rerender=()=>route();

/* 큰 제목이 헤더 뒤로 들어가면 작은 제목을 켠다 */
$('#view').addEventListener('scroll',()=>{
 const big=$('#view h1'), g=$('.gnb');
 if(!big){g.classList.toggle('small',$('#view').scrollTop>8);return}
 g.classList.toggle('small',big.getBoundingClientRect().bottom<g.getBoundingClientRect().bottom+4);
},{passive:true});

/* ── 이벤트 ── */
/* 결과만 갈아끼운다. 화면 전체를 다시 그리면 입력 포커스가 날아간다. */
function paintSearch(){
 const box=$('#sres'); if(box)box.innerHTML=searchBody(S.q);
 const f=$('#sform'); if(f){
  const x=f.querySelector('.x');
  if(S.q&&!x){f.insertAdjacentHTML('beforeend',`<button type="button" class="x" data-kw="" aria-label="검색어 지우기">${I.x}</button>`)}
  else if(!S.q&&x){x.remove()}
 }
 history.replaceState(null,'','#/search'+(S.q?'?q='+encodeURIComponent(S.q):''));
}
document.addEventListener('input',e=>{
 if(!e.target.closest('#sq'))return;
 S.q=e.target.value; paintSearch();
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('#sform'); if(!f)return;
 e.preventDefault(); $('#sq')?.blur();
});

document.addEventListener('change',e=>{
 const f=e.target.closest('[data-hf]'); if(!f)return;
 S.hf[f.dataset.hf]=f.value; rerenderHomeGrid();
});
function rerenderHomeGrid(){
 const g=$('#hgrid'); if(!g)return;
 g.innerHTML=homeGrid(); const c=$('#hcount'); if(c)c.textContent=homeList().length+'종';
 const bar=$('.fbar'); if(bar){bar.querySelectorAll('.fsel').forEach(l=>{const k=l.querySelector('select').dataset.hf;
  l.classList.toggle('on',!!S.hf[k]); l.querySelector('span').textContent=S.hf[k]||l.querySelector('select').getAttribute('aria-label')});
  const has=S.hf.b||S.hf.n||S.hf.f, rs=bar.querySelector('[data-hf-reset]');
  if(has&&!rs)bar.insertAdjacentHTML('beforeend',`<button class="chip" data-hf-reset>${I.x} 초기화</button>`);
  if(!has&&rs)rs.remove();
  const cnt=bar.querySelector('.fcount'); if(cnt)bar.appendChild(cnt);}
}
document.addEventListener('submit',e=>{
 const f=e.target.closest('#hsearch'); if(!f)return;
 e.preventDefault(); S.q=$('#hq').value.trim(); location.hash='#/search'+(S.q?'?q='+encodeURIComponent(S.q):''); rerender();
});

document.addEventListener('click',e=>{
 const t=e.target;
 const w=t.closest('[data-wish]');
 if(w){const id=+w.dataset.wish; S.wish.has(id)?S.wish.delete(id):S.wish.add(id);
  const on=S.wish.has(id); document.querySelectorAll(`[data-wish="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  toast(on?'찜했습니다':'찜을 뺐습니다'); return}
 const hr=t.closest('[data-hf-reset]'); if(hr){S.hf={b:'',n:'',f:''}; document.querySelectorAll('[data-hf]').forEach(x=>x.value=''); rerenderHomeGrid(); return}
 const jump=t.closest('[data-jump]');
 if(jump){e.preventDefault();const sec=document.getElementById(jump.dataset.jump);
  if(sec){sec.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  document.querySelectorAll('.pdx-nav a').forEach(a=>a.classList.toggle('on',a===jump));return}
 const kw=t.closest('[data-kw]');
 if(kw){S.q=kw.dataset.kw;const i=$('#sq');if(i)i.value=S.q;paintSearch();if(!S.q&&i)i.focus();return}
 const flt=t.closest('[data-flt]'); if(flt){S.flt=flt.dataset.flt;rerender();return}
 const bi=t.closest('[data-bi]'); if(bi){state.bi=+bi.dataset.bi;rerender();return}
 const ni=t.closest('[data-ni]'); if(ni){state.ni=+ni.dataset.ni;rerender();return}
 const inc=t.closest('[data-inc]'); if(inc){const c=S.cart[+inc.dataset.inc];
  c.q+=c.per;c.pay+=c.unit;rerender();return}
 const dec=t.closest('[data-dec]'); if(dec){const i=+dec.dataset.dec,c=S.cart[i];
  if(c.q<=c.per){S.cart.splice(i,1)}else{c.q-=c.per;c.pay-=c.unit}rerender();return}
 const del=t.closest('[data-del]'); if(del){S.cart.splice(+del.dataset.del,1);rerender();toast('삭제했습니다');return}
 const a=t.closest('[data-act]'); if(!a)return;
 const act=a.dataset.act;

 if(act==='cart'||act==='buy'){
  const pid=+location.hash.split('/')[2],p=find(pid),b=BUNDLES[state.bi];
  if(p.out){toast('품절된 상품입니다. 재입고 알림을 받아보세요');return}
  const pay=(b.mult||b.q)*p.p;
  S.cart.push({pid,bundle:b.k,nic:p.nic[state.ni],q:b.q,per:b.q,unit:pay,pay});
  if(act==='cart'){syncChrome(location.hash.split('/')[1]);toast('장바구니에 담았습니다')}
  else location.hash='#/checkout';
  return;
 }
 if(act==='copy'){toast('계좌번호를 복사했습니다');return}
 if(act==='login'){
  const id=$('#lId').value.trim()||'duckhoo';
  S.user={id,name:'홍길동',tel:'010-0000-0000'};
  toast('로그인했습니다');
  location.hash=a.dataset.next?'#/'+a.dataset.next:'#/my'; rerender(); return;
 }
 if(act==='pass'){
  modal('PASS 본인확인','<p>실제 사이트에서는 여기서 PASS 앱 인증창이 열립니다. 데모에서는 통과한 것으로 처리합니다.</p>',
   '인증 완료',()=>{state.joined=true;rerender();toast('본인확인이 완료됐습니다')});
  return;
 }
 if(act==='join'){
  const name=$('#jName').value.trim()||'홍길동';
  S.user={id:$('#jId').value.trim()||'duckhoo',name,tel:$('#jTel').value.trim()};
  state.joined=false; location.hash='#/my'; rerender(); toast('가입이 완료됐습니다'); return;
 }
 if(act==='order'){
  const dep=$('#oDep').value.trim(),name=$('#oName').value.trim();
  const id=++S.seq, sum=cartSum(), sh=ship();
  /* 입금자명이 주문자명과 다르면 확인필요로 들어간다 — 실제 매칭 규칙 그대로 */
  const st=dep===name?'pend':'chk';
  S.orders.unshift({id,st,date:'2026.09.02',items:S.cart.slice(),sum,ship:sh,total:sum+sh,depositor:dep});
  S.cart=[]; location.hash='#/done/'+id; rerender();
  if(st==='chk')toast('입금자명이 주문자명과 달라 확인필요로 접수됐습니다');
  return;
 }
 if(act==='cancel'){
  const oid=+a.dataset.oid;
  modal('주문을 취소할까요?','<p>취소하면 되돌릴 수 없습니다. 이미 입금하셨다면 환불까지 1~2일 걸립니다.</p>',
   '주문 취소',()=>{S.orders=S.orders.filter(o=>o.id!==oid);location.hash='#/orders';rerender();
    toast('주문이 취소됐습니다')},true);
  return;
 }
 if(act==='logout'){S.user=null;location.hash='#/';rerender();toast('로그아웃했습니다');return}
 if(act==='leave'){
  /* 실제 사이트와 같은 규칙: 끝나지 않은 주문이 있거나 적립금이 남아 있으면 막는다.
     계정을 지우지는 않는다 — 로그인을 끊고 개인정보만 지운다. 주문 기록은 5년 보존이다. */
  const stop=leaveBlockers();
  if(stop.length){
   modal('지금은 탈퇴할 수 없습니다',
    '<ul style="margin:0;padding-left:1.1rem">'+stop.map(r=>`<li>${r}</li>`).join('')+'</ul>',
    '알겠습니다',null);
   return;
  }
  modal('정말 탈퇴하시겠어요?',
   '<p>탈퇴하면 로그인할 수 없게 되고 이름·연락처·주소가 지워집니다. 되돌릴 수 없습니다.</p>'+
   '<p style="margin-top:.6rem">주문 기록은 남습니다. 전자상거래법상 거래기록은 5년간 보관해야 합니다.</p>',
   '탈퇴하기',()=>{S={user:null,cart:[],orders:[],flt:'전체',seq:S.seq,points:0,q:'',wish:new Set(),hf:{b:'',n:'',f:''}};
    location.hash='#/';rerender();toast('탈퇴가 완료됐습니다')},true);
  return;
 }
});
$('#dim').addEventListener('click',closeModal);
$('#mCancel').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',route);

  sum:39000,ship:0,total:39000,depositor:'홍길동'},

  sum:8100,ship:3000,total:11100,depositor:'홍길순'},
 {id:10479,st:'pend',date:'2026.08.27',items:[{pid:13,bundle:'단품 1병',nic:'9.8mg',q:1,per:1,unit:15000,pay:15000}],
  sum:15000,ship:3000,total:18000,depositor:'홍길동'},
];
